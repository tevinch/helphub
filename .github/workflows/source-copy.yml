name: Check project restore
on:
  push:
    paths:
      - 'examples/source-copy/**'
      - '.github/workflows/source-copy.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Run container comparisons
        run: sh examples/source-copy/verify.sh
