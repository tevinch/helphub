name: Selection editor prerequisite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Inspect the reviewed sources
        run: |
          test "$GITHUB_REPOSITORY" = tevinch/helphub
          test "$GITHUB_REF" = refs/heads/main
          test "$GITHUB_SERVER_URL" = https://github.com
          sha256sum --check .github/checks/selection-wrap/SHA256SUMS
      - name: Observe the native editor prerequisite
        run: python3 .github/checks/selection-wrap/prepare.py --output "$RUNNER_TEMP/selection-wrap-evidence"
      - name: Retain synthetic native observations
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: selection-editor-prerequisite
          path: ${{ runner.temp }}/selection-wrap-evidence
          if-no-files-found: error
          retention-days: 3
