name: Packaged user unit

on:
  workflow_dispatch:
  push:
    paths:
      - 'examples/packaged-unit-enable/**'
      - '.github/workflows/packaged-user-unit.yml'

permissions:
  contents: read

jobs:
  native-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install Nix 2.35.4
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            https://releases.nixos.org/nix/nix-2.35.4/install \
            --output "$RUNNER_TEMP/install-nix.sh"
          NIX_INSTALLER_NO_MODIFY_PROFILE=1 sh "$RUNNER_TEMP/install-nix.sh" --no-daemon --yes
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
      - name: Verify actual activation and fresh user-manager startup
        shell: bash
        run: |
          nix --version
          systemctl --version
          bash examples/packaged-unit-enable/tests/verify.sh
