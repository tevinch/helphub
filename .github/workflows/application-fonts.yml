name: Application font checks

on:
  push:
    branches: [main]
    paths:
      - '.github/checks/application-fonts/**'
      - '.github/workflows/application-fonts.yml'

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check native font configuration
        shell: bash
        run: |
          set -euo pipefail
          task_path=/usr/local/bin:/usr/bin:/bin
          test "${GITHUB_REPOSITORY}" = tevinch/helphub
          test "${GITHUB_SERVER_URL}" = https://github.com
          test "${GITHUB_REF}" = refs/heads/main
          [[ "${GITHUB_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "$(uname -s)" = Linux
          test "$(uname -m)" = x86_64
          runner_temp=$(realpath -e -- "${RUNNER_TEMP}")
          test -d "$runner_temp"
          test "$runner_temp" != /
          work=$(mktemp -d "$runner_temp/application-fonts.XXXXXXXX")
          cleanup() {
            primary_status=$?
            trap - EXIT
            if env -i PATH="$task_path" /usr/bin/python3 - "$runner_temp" "$work" <<'PYCLEAN'
          import os, pathlib, re, shutil, stat, sys
          parent = pathlib.Path(sys.argv[1]).resolve(strict=True)
          work = pathlib.Path(sys.argv[2])
          if (parent == pathlib.Path('/') or work.parent != parent
                  or not re.fullmatch(r'application-fonts\.[A-Za-z0-9]{8}', work.name)
                  or work.is_symlink() or not work.is_dir()
                  or work.resolve(strict=True) != work
                  or work.stat().st_uid != os.getuid()):
              raise SystemExit('Refusing unsafe cleanup path')
          try:
              shutil.rmtree(work)
          except OSError:
              if work.exists():
                  work.chmod(0o700)
                  for root, directories, _ in os.walk(work, topdown=True, followlinks=False):
                      for name in directories:
                          path = pathlib.Path(root) / name
                          if not path.is_symlink():
                              if path.stat().st_uid != os.getuid():
                                  raise SystemExit('Refusing permission recovery for a foreign directory')
                              path.chmod(0o700)
                  shutil.rmtree(work)
          if work.exists() or work.is_symlink():
              raise SystemExit('Owned work tree remains after cleanup')
          print('Owned work tree cleanup complete', flush=True)
          PYCLEAN
            then
              cleanup_status=0
            else
              cleanup_status=$?
              printf 'Owned cleanup failed with status %s\n' "$cleanup_status" >&2
            fi
            if test "$primary_status" -eq 0 && test "$cleanup_status" -ne 0; then
              primary_status=$cleanup_status
            fi
            exit "$primary_status"
          }
          trap cleanup EXIT
          trap 'exit 143' TERM
          trap 'exit 130' INT
          mkdir -m 700 "$work/home" "$work/tmp"
          task_home="$work/home"
          task_tmp="$work/tmp"
          printf 'Runner image: %s\n' "${ImageVersion:-unreported}"
          python3 - "$work" <<'PYGUARD'
          import shutil, sys
          free = shutil.disk_usage(sys.argv[1]).free
          print('Free bytes before download:', free, flush=True)
          if free < 1024 ** 3:
              raise SystemExit('Free-space prerequisite failed')
          PYGUARD
          clean=(env -i PATH="$task_path" HOME="$task_home" TMPDIR="$task_tmp" LANG=C.UTF-8 LC_ALL=C.UTF-8)
          "${clean[@]}" git -c init.defaultBranch=main init -q "$work/checkout"
          "${clean[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
            git -C "$work/checkout" -c credential.helper= -c http.extraHeader= \
            fetch --quiet --depth=1 https://github.com/tevinch/helphub "$GITHUB_SHA"
          "${clean[@]}" GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_GLOBAL=/dev/null GIT_TERMINAL_PROMPT=0 \
            git -C "$work/checkout" checkout --quiet --detach FETCH_HEAD
          test "$("${clean[@]}" git -C "$work/checkout" rev-parse HEAD)" = "$GITHUB_SHA"
          source="$work/checkout/.github/checks/application-fonts"
          python3 - "$source" <<'PYHASH'
          import hashlib, pathlib, sys
          source = pathlib.Path(sys.argv[1])
          expected = {'consumer/CMakeLists.txt': 'aa8679b330f36ae134b8087f5da69fbfef7f4c88287d3060b25103617e7dc74a', 'consumer/font-inspector.cpp': '12a7caa98f18cb6198cd080cbfc52fff42b53f97318f42ff55caeaf03d5060f1', 'sans12.qss': '0863e8c4978d22e61beab18d54515b632af2ddf106002ba5184fecea08482939', 'verify.py': 'a6072e15e1d93d5b160e8de1fbe2912c61dec1a262151160f38cc90892a0cd7b'}
          actual = {}
          for path in source.rglob('*'):
              if path.is_symlink():
                  raise SystemExit('Source contains a symlink')
              if path.is_file():
                  actual[str(path.relative_to(source))] = hashlib.sha256(path.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit('Reviewed source manifest mismatch')
          print('Exact reviewed source manifest:', actual, flush=True)
          PYHASH
          # Prepare the SDK's link and observed XCB runtime dependencies from Ubuntu.
          test -r /usr/share/keyrings/ubuntu-archive-keyring.gpg
          test -x /usr/bin/apt-get
          test -x /usr/bin/apt-cache
          test -x /usr/bin/timeout
          test -x /usr/bin/sudo
          test "$(dpkg --print-architecture)" = amd64
          . /etc/os-release
          test "$ID" = ubuntu
          test "$VERSION_ID" = 24.04
          apt_work="$work/apt"
          mkdir -m 755 "$apt_work" "$apt_work/empty" "$apt_work/lists"
          # _apt may traverse the public metadata path; HOME/TMP remain mode0700.
          chmod 711 "$work"
          cat > "$apt_work/sources.list" <<'APTSOURCES'
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble main
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://archive.ubuntu.com/ubuntu noble-updates main
          deb [arch=amd64 signed-by=/usr/share/keyrings/ubuntu-archive-keyring.gpg] https://security.ubuntu.com/ubuntu noble-security main
          APTSOURCES
          cat > "$apt_work/apt.conf" <<APTCONF
          Dir::Etc::parts "$apt_work/empty";
          Dir::Etc::main "/dev/null";
          Dir::Etc::sourcelist "$apt_work/sources.list";
          Dir::Etc::sourceparts "$apt_work/empty";
          Dir::Etc::preferences "/dev/null";
          Dir::Etc::preferencesparts "$apt_work/empty";
          Dir::Etc::netrc "/dev/null";
          Dir::Etc::netrcparts "$apt_work/empty";
          Dir::Etc::trusted "/dev/null";
          Dir::Etc::trustedparts "$apt_work/empty";
          Dir::State::lists "$apt_work/lists";
          Dir::Cache::pkgcache "";
          Dir::Cache::srcpkgcache "";
          APT::Install-Recommends "false";
          APT::Install-Suggests "false";
          APT::Get::AllowUnauthenticated "false";
          Acquire::AllowInsecureRepositories "false";
          Acquire::AllowDowngradeToInsecureRepositories "false";
          Acquire::Check-Valid-Until "true";
          Acquire::Languages "none";
          Acquire::https::Verify-Peer "true";
          Acquire::https::Verify-Host "true";
          APTCONF
          chmod 644 "$apt_work/apt.conf" "$apt_work/sources.list"
          apt_clean=(env -i PATH="$task_path" HOME="$task_home" TMPDIR="$task_tmp" LANG=C.UTF-8 LC_ALL=C.UTF-8 APT_CONFIG="$apt_work/apt.conf")
          # Read-only host package/key provenance; no new repository/key is installed.
          "${clean[@]}" dpkg-query -W ubuntu-keyring
          "${clean[@]}" dpkg-query -S /usr/share/keyrings/ubuntu-archive-keyring.gpg
          # Metadata update runs unprivileged into fresh task-owned lists.
          "${apt_clean[@]}" /usr/bin/timeout --signal=TERM --kill-after=10s 180s \
            /usr/bin/apt-get --error-on=any update
          "${apt_clean[@]}" /usr/bin/python3 - "$apt_work" <<'APTPLAN'
          import email.parser, json, pathlib, re, subprocess, sys
          root = pathlib.Path(sys.argv[1])
          allowed_sites = {'archive.ubuntu.com', 'security.ubuntu.com'}
          allowed_suites = {'noble', 'noble-updates', 'noble-security'}
          releases = list((root / 'lists').glob('*_InRelease'))
          if len(releases) != 3:
              raise SystemExit('Expected all three fresh authenticated Ubuntu release files')
          for path in releases:
              text = path.read_text().split('\n\n', 1)[1].split('\n-----BEGIN PGP SIGNATURE-----', 1)[0]
              fields = email.parser.Parser().parsestr(text)
              if (fields['Origin'] != 'Ubuntu' or fields['Label'] != 'Ubuntu'
                      or fields['Codename'] != 'noble' or fields['Suite'] not in allowed_suites):
                  raise SystemExit('Unexpected signed repository release identity')
              print(json.dumps({'release': path.name, 'origin': fields['Origin'], 'suite': fields['Suite']}))
          
          def command(args):
              result = subprocess.run(args, capture_output=True, text=True, timeout=90, check=True)
              print(result.stdout, end='', flush=True)
              if result.stderr:
                  print(result.stderr, file=sys.stderr, end='', flush=True)
              return result.stdout
          
          def candidate(name, required=None):
              if not re.fullmatch(r'[a-z0-9][a-z0-9+.-]*(?::amd64)?', name):
                  raise SystemExit('Unexpected package name')
              policy = command(['/usr/bin/apt-cache', 'policy', name])
              found = re.search(r'^\s*Candidate:\s*(\S+)\s*$', policy, re.M)
              if not found or found[1] == '(none)' or (required is not None and found[1] != required):
                  raise SystemExit('Missing or changed package candidate')
              version, active, origins = found[1], False, []
              for line in policy.splitlines():
                  header = re.fullmatch(r'\s+(?:\*\*\*\s+)?(\S+)\s+\d+\s*', line)
                  if header:
                      active = header[1] == version
                  elif active and re.search(r'\s(?:https?://)', line):
                      match = re.fullmatch(r'\s+\d+ https[:]//([^/]+)/ubuntu (\S+)/main amd64 Packages\s*', line)
                      if not match or match[1] not in allowed_sites or match[2] not in allowed_suites:
                          raise SystemExit('Non-Ubuntu candidate source')
                      origins.append({'site': match[1], 'suite': match[2]})
              if not origins:
                  raise SystemExit('Candidate lacks a verified Ubuntu package index')
              return version, origins
          
          requested = ['libopengl-dev', 'libglx-dev',
              'libxcb-image0', 'libxcb-icccm4', 'libxcb-shape0', 'libxcb-keysyms1',
              'libxcb-xinerama0', 'libxcb-xkb1', 'libxcb-render-util0', 'libxkbcommon-x11-0']
          pins = {name: candidate(name)[0] for name in requested}
          simulation = command(['/usr/bin/apt-get', '--simulate', '--no-remove', '--no-install-recommends',
                                'install', *(f'{name}={version}' for name, version in pins.items())])
          changes = []
          for line in simulation.splitlines():
              if line.startswith('Remv '):
                  raise SystemExit('Package removal is outside this setup')
              if line.startswith('Inst '):
                  # A bracketed old version would mean an existing package changes: stop.
                  match = re.match(r'^Inst ([a-z0-9][a-z0-9+.:_-]*) \((\S+) ', line)
                  if not match:
                      raise SystemExit('Existing-package change or unexpected APT plan')
                  name, version = match.groups()
                  selected, origins = candidate(name, version)
                  metadata = command(['/usr/bin/apt-cache', 'show', '--no-all-versions', f'{name}={selected}'])
                  size = re.search(r'^Size: (\d+)$', metadata, re.M)
                  if not size:
                      raise SystemExit('Missing authenticated package size')
                  changes.append({'name': name, 'version': selected, 'origins': origins, 'bytes': int(size[1])})
                  pins[name] = selected
          if len(changes) > 20 or sum(change['bytes'] for change in changes) > 50 * 1024 ** 2:
              raise SystemExit('Ordinary dependency plan exceeds bounds')
          (root / 'pins.txt').write_text(''.join(f'{name}={version}\n' for name, version in sorted(pins.items())))
          print(json.dumps({'requested': requested, 'authenticatedInstallPlan': changes, 'pins': pins}), flush=True)
          APTPLAN
          mapfile -t apt_pins < "$apt_work/pins.txt"
          test "${#apt_pins[@]}" -ge 2
          # Keep APT's normal archive, sandbox, dpkg and log paths for this ephemeral job.
          sudo -n env -i PATH="$task_path" HOME="$task_home" TMPDIR="$task_tmp" LANG=C.UTF-8 LC_ALL=C.UTF-8 \
            DEBIAN_FRONTEND=noninteractive APT_CONFIG="$apt_work/apt.conf" \
            /usr/bin/timeout --signal=TERM --kill-after=10s 180s \
            /usr/bin/apt-get --assume-yes --no-remove --no-upgrade --no-install-recommends install "${apt_pins[@]}"
          "${clean[@]}" dpkg-query -W libopengl-dev libglx-dev
          "${clean[@]}" dpkg-query -S /usr/lib/x86_64-linux-gnu/libOpenGL.so /usr/lib/x86_64-linux-gnu/libGLX.so
          test -f /usr/lib/x86_64-linux-gnu/libOpenGL.so
          test -f /usr/lib/x86_64-linux-gnu/libGLX.so
          sdk="$work/copperspice-2.1.0-ubuntu24.04-x64.tar.bz2"
          "${clean[@]}" curl -q --fail --location --proto '=https' --proto-redir '=https' \
            --connect-timeout 20 --max-time 120 --max-filesize 46307026 \
            --output "$sdk" \
            https://github.com/copperspice/copperspice/releases/download/cs-2.1.0/copperspice-2.1.0-ubuntu24.04-x64.tar.bz2
          "${clean[@]}" python3 "$source/verify.py" --sdk-archive "$sdk" --work-parent "$work"
