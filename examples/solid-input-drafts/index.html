<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Keep an input draft when disabling it</title>
  <style>
    body { font: 16px/1.5 system-ui, sans-serif; margin: 2rem auto; padding: 0 1rem; max-width: 52rem; color: #172331; background: #fafbfc; }
    section { background: white; padding: 1.25rem; margin: 1.5rem 0; border: 1px solid #cbd5e1; border-radius: .6rem; }
    label { display: block; margin: 1rem 0; }
    input { display: block; margin-top: .3rem; padding: .5rem; font: inherit; max-width: 100%; box-sizing: border-box; }
    input:disabled { background: #e2e8f0; }
    button { margin: .3rem .3rem .3rem 0; padding: .5rem .8rem; font: inherit; cursor: pointer; }
    output, code { overflow-wrap: anywhere; }
    h1 { line-height: 1.2; }
  </style>
</head>
<body>
  <main id="app"></main>
  <script type="module" src="/main.js"></script>
</body>
</html>
