<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Different fonts in a chart legend</title><link rel="stylesheet" href="/style.css"></head>
<body><main><h1>Different fonts in a chart legend</h1>
<p>Each label has its own font. Select a label to hide or show its line.</p>
<div class="chart"><canvas id="chart" aria-label="Two line datasets from January to June" role="img"></canvas></div>
<div id="legend" aria-label="Chart legend"><p id="legend-note">Both datasets contain six points.</p></div>
<button id="update" type="button">Update data</button>
<script src="/chart.js"></script><script type="module" src="/main.mjs"></script></main></body></html>
