<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Canvas legend font control</title></head>
<body><canvas id="chart" width="600" height="300"></canvas><script src="/chart.js"></script><script>
new Chart(document.getElementById('chart'), {
  type: 'line',
  data: { labels: ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun'], datasets: [
    { label: 'Number 1', data: [10, 20, 30, 40, 50, 60], borderColor: 'red' },
    { label: 'Number 2', data: [60, 50, 40, 30, 20, 10], borderColor: 'black' }
  ] },
  options: { responsive: false, animation: false, plugins: { legend: { labels: {
    generateLabels(chart) {
      return Chart.defaults.plugins.legend.labels.generateLabels(chart).map((item, i) => ({
        ...item, fontFamily: i === 0 ? 'Arial' : 'Georgia', fontSize: i === 0 ? 20 : 12,
        fontStyle: i === 0 ? 'italic' : 'normal', fontWeight: i === 0 ? 'bold' : 'normal',
        font: { family: i === 0 ? 'Arial' : 'Georgia', size: i === 0 ? 20 : 12,
          style: i === 0 ? 'italic' : 'normal', weight: i === 0 ? 'bold' : 'normal' },
        fontColor: i === 0 ? 'red' : 'green'
      }));
    }
  } } } }
});
</script></body></html>
